    <style>.st{animation:st 3s ease-in-out infinite;opacity:0}.s2{animation-delay:-1s}.s3{animation-delay:-2s}@keyframes st{0%{opacity:0;transform:translateY(10px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-40px)}}</style>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
